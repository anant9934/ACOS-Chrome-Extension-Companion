name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Core
        run: pnpm --filter @repo/core build

      - name: Build Chrome Extension
        run: pnpm --filter chrome-extension build
        env:
          NODE_ENV: production

      - name: Package Extension
        run: |
          cd apps/chrome-extension/build
          zip -r ../../../universal-companion-chrome.zip .

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            universal-companion-chrome.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
